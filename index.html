<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Account Checker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle at top, #181926 0%, #0d0e15 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .tiktok-gradient-text {
      background: linear-gradient(45deg, #00f2fe, #4facfe, #ff0050);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center p-4 sm:p-6">

  <header class="w-full max-w-md text-center my-6">
    <div class="inline-flex items-center gap-2 mb-2">
      <i class="fa-brands fa-tiktok text-3xl text-[#00f2fe]"></i>
      <h1 class="text-3xl font-extrabold tracking-tight tiktok-gradient-text">TikTok Checker</h1>
    </div>
    <p class="text-slate-400 text-xs sm:text-sm">Tra cứu thông tin tài khoản TikTok trực tiếp</p>
  </header>

  <main class="w-full max-w-md bg-[#1e2030]/90 border border-slate-700/60 backdrop-blur-md rounded-2xl p-5 sm:p-6 shadow-2xl">
    
    <!-- Search Input -->
    <div class="flex flex-col gap-3">
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 font-bold">@</span>
        <input 
          type="text" 
          id="usernameInput" 
          placeholder="Nhập username (ví dụ: just.haru36)..." 
          class="w-full pl-8 pr-4 py-3 bg-[#13141f] border border-slate-700 rounded-xl focus:outline-none focus:border-[#00f2fe] text-white text-sm placeholder:text-slate-500"
          autocomplete="off"
        />
      </div>
      <button 
        id="checkBtn" 
        onclick="checkTikTokUser()" 
        class="w-full py-3 bg-gradient-to-r from-[#ff0050] to-[#e00448] active:scale-[0.98] font-semibold rounded-xl text-white shadow-lg shadow-pink-500/20 transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Tra Cứu</span>
      </button>
    </div>

    <!-- Alert Status -->
    <div id="statusBox" class="hidden mt-4 p-4 rounded-xl text-sm font-medium break-words"></div>

    <!-- Loading Skeleton -->
    <div id="loadingBox" class="hidden mt-6 animate-pulse flex flex-col items-center">
      <div class="w-20 h-20 bg-slate-700 rounded-full mb-3"></div>
      <div class="w-36 h-5 bg-slate-700 rounded-md mb-2"></div>
      <div class="w-24 h-4 bg-slate-700 rounded-md mb-6"></div>
      <div class="grid grid-cols-2 gap-3 w-full">
        <div class="h-16 bg-slate-700/60 rounded-xl"></div>
        <div class="h-16 bg-slate-700/60 rounded-xl"></div>
      </div>
    </div>

    <!-- Result Card -->
    <div id="resultBox" class="hidden mt-6 flex flex-col items-center">
      <div class="relative">
        <img 
          id="userAvatar" 
          src="" 
          alt="Avatar" 
          class="w-24 h-24 rounded-full border-4 border-[#00f2fe] shadow-lg object-cover bg-slate-800"
        />
      </div>

      <h2 id="userNickname" class="text-lg font-bold mt-3 text-white text-center"></h2>
      <a id="userHandleLink" href="#" target="_blank" class="text-slate-400 text-xs mb-3 hover:text-[#00f2fe]"></a>

      <!-- Stats Grid -->
      <div class="grid grid-cols-2 gap-2.5 w-full mb-4 text-center">
        <div class="bg-[#13141f] border border-slate-800 p-3 rounded-xl">
          <span class="text-slate-400 text-[11px] uppercase font-medium block">Followers</span>
          <span id="statFollowers" class="text-base font-extrabold text-[#00f2fe]">0</span>
        </div>
        <div class="bg-[#13141f] border border-slate-800 p-3 rounded-xl">
          <span class="text-slate-400 text-[11px] uppercase font-medium block">Đang Follow</span>
          <span id="statFollowing" class="text-base font-extrabold text-white">0</span>
        </div>
        <div class="bg-[#13141f] border border-slate-800 p-3 rounded-xl">
          <span class="text-slate-400 text-[11px] uppercase font-medium block">Lượt Thích</span>
          <span id="statLikes" class="text-base font-extrabold text-[#ff0050]">0</span>
        </div>
        <div class="bg-[#13141f] border border-slate-800 p-3 rounded-xl">
          <span class="text-slate-400 text-[11px] uppercase font-medium block">Video</span>
          <span id="statVideos" class="text-base font-extrabold text-amber-400">0</span>
        </div>
      </div>

      <!-- Button Open Profile -->
      <a 
        id="profileBtn" 
        href="#" 
        target="_blank" 
        class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-center text-sm font-medium transition-all flex items-center justify-center gap-2">
        <i class="fa-brands fa-tiktok"></i> Mở hồ sơ TikTok
      </a>
    </div>
  </main>

  <script>
    function formatNumber(num) {
      if (num === null || num === undefined || isNaN(Number(num))) return '--';
      return Number(num).toLocaleString('vi-VN');
    }

    document.getElementById('usernameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkTikTokUser();
    });

    // Gọi API qua JSONP Proxy an toàn không bao giờ dính CORS trên Safari
    function fetchJsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');
        
        window[callbackName] = function(data) {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve(data);
        };

        script.onerror = function() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          reject(new Error('Lỗi kết nối proxy'));
        };

        script.src = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&callback=${callbackName}`;
        document.body.appendChild(script);

        // Timeout 8s
        setTimeout(() => {
          if (window[callbackName]) {
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
            reject(new Error('Hết thời gian chờ phản hồi'));
          }
        }, 8000);
      });
    }

    async function checkTikTokUser() {
      const input = document.getElementById('usernameInput');
      let username = input.value.trim().toLowerCase();

      if (!username) {
        showStatus('Vui lòng nhập username TikTok!', 'warning');
        return;
      }

      username = username.replace(/^@/, '');
      if (username.includes('tiktok.com/@')) {
        username = username.split('tiktok.com/@')[1].split('/')[0].split('?')[0];
      }

      const checkBtn = document.getElementById('checkBtn');
      const statusBox = document.getElementById('statusBox');
      const loadingBox = document.getElementById('loadingBox');
      const resultBox = document.getElementById('resultBox');

      checkBtn.disabled = true;
      checkBtn.style.opacity = '0.5';
      statusBox.classList.add('hidden');
      resultBox.classList.add('hidden');
      loadingBox.classList.remove('hidden');

      try {
        // 1. Lấy sec_uid từ Countik exist API
        const existRes = await fetchJsonp(`https://countik.com/api/exist/${username}`);
        if (!existRes || !existRes.contents) {
          throw new Error('Máy chủ Countik không phản hồi.');
        }

        let existData;
        try {
          existData = JSON.parse(existRes.contents);
        } catch(e) {
          throw new Error('API Countik tạm thời khóa truy cập IP này.');
        }

        if (!existData || existData.status === false || !existData.sec_uid) {
          throw new Error('Tài khoản không tồn tại hoặc bị khóa.');
        }

        // 2. Lấy thông số chi tiết qua sec_uid
        const detailRes = await fetchJsonp(`https://countik.com/api/user/id/${existData.sec_uid}`);
        let userData;
        try {
          userData = JSON.parse(detailRes.contents);
        } catch(e) {
          throw new Error('Không thể đọc dữ liệu tài khoản.');
        }

        if (!userData || userData.status === false) {
          throw new Error('Không tải được số liệu chi tiết.');
        }

        // 3. Render giao diện
        renderUI({
          username: username,
          nickname: userData.nickname || username,
          avatar: userData.avatar,
          followers: userData.follower_count,
          following: userData.following_count,
          likes: userData.heart_count || userData.heart,
          videos: userData.video_count
        });

      } catch (err) {
        showStatus(err.message || 'Lỗi không xác định khi tra cứu.', 'error');
      } finally {
        checkBtn.disabled = false;
        checkBtn.style.opacity = '1';
        loadingBox.classList.add('hidden');
      }
    }

    function renderUI(info) {
      document.getElementById('userNickname').innerText = info.nickname;
      document.getElementById('userHandleLink').innerText = `@${info.username}`;
      document.getElementById('userHandleLink').href = `https://www.tiktok.com/@${info.username}`;
      document.getElementById('profileBtn').href = `https://www.tiktok.com/@${info.username}`;
      
      const avatar = document.getElementById('userAvatar');
      avatar.src = info.avatar || 'https://via.placeholder.com/150';
      avatar.onerror = () => { avatar.src = 'https://via.placeholder.com/150'; };

      document.getElementById('statFollowers').innerText = formatNumber(info.followers);
      document.getElementById('statFollowing').innerText = formatNumber(info.following);
      document.getElementById('statLikes').innerText = formatNumber(info.likes);
      document.getElementById('statVideos').innerText = formatNumber(info.videos);

      document.getElementById('resultBox').classList.remove('hidden');
    }

    function showStatus(msg, type = 'info') {
      const box = document.getElementById('statusBox');
      box.className = 'mt-4 p-4 rounded-xl text-sm font-medium break-words';
      
      if (type === 'error') {
        box.className += ' bg-red-900/40 border border-red-600 text-red-300';
      } else if (type === 'warning') {
        box.className += ' bg-amber-900/40 border border-amber-600 text-amber-300';
      }
      box.innerHTML = `<i class="fa-solid fa-circle-exclamation mr-2"></i>${msg}`;
      box.classList.remove('hidden');
    }
  </script>
</body>
</html>
