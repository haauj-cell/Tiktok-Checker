<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Info Checker (Countik API)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle at top, #181926 0%, #0d0e15 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .tiktok-gradient-text {
      background: linear-gradient(45deg, #00f2fe, #4facfe, #ff0050);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center p-4 sm:p-6">

  <!-- Header -->
  <header class="w-full max-w-2xl text-center my-6">
    <div class="inline-flex items-center gap-2 mb-2">
      <i class="fa-brands fa-tiktok text-3xl text-[#00f2fe]"></i>
      <h1 class="text-3xl font-extrabold tracking-tight tiktok-gradient-text">TikTok Account Checker</h1>
    </div>
    <p class="text-slate-400 text-sm">Tra cứu thông tin, chỉ số realtime tài khoản TikTok qua API Countik</p>
  </header>

  <!-- Main Box -->
  <main class="w-full max-w-2xl bg-[#1e2030]/90 border border-slate-700/60 backdrop-blur-md rounded-2xl p-6 shadow-2xl">
    
    <!-- Search Input -->
    <div class="flex flex-col sm:flex-row gap-3">
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 font-bold">@</span>
        <input 
          type="text" 
          id="usernameInput" 
          placeholder="Nhập username (ví dụ: mrbeast, charlidamelio)..." 
          class="w-full pl-8 pr-4 py-3 bg-[#13141f] border border-slate-700 rounded-xl focus:outline-none focus:border-[#00f2fe] focus:ring-1 focus:ring-[#00f2fe] text-white transition-all text-sm sm:text-base placeholder:text-slate-500"
          autocomplete="off"
        />
      </div>
      <button 
        id="checkBtn" 
        onclick="checkTikTokUser()" 
        class="px-6 py-3 bg-gradient-to-r from-[#ff0050] to-[#e00448] hover:opacity-90 font-semibold rounded-xl text-white shadow-lg shadow-pink-500/20 transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Tra Cứu</span>
      </button>
    </div>

    <!-- Alert / Status -->
    <div id="statusBox" class="hidden mt-4 p-4 rounded-xl text-sm font-medium"></div>

    <!-- Loading Skeleton -->
    <div id="loadingBox" class="hidden mt-6 animate-pulse flex flex-col items-center">
      <div class="w-24 h-24 bg-slate-700 rounded-full mb-3"></div>
      <div class="w-40 h-5 bg-slate-700 rounded-md mb-2"></div>
      <div class="w-28 h-4 bg-slate-700 rounded-md mb-6"></div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full">
        <div class="h-20 bg-slate-700/60 rounded-xl"></div>
        <div class="h-20 bg-slate-700/60 rounded-xl"></div>
        <div class="h-20 bg-slate-700/60 rounded-xl"></div>
        <div class="h-20 bg-slate-700/60 rounded-xl"></div>
      </div>
    </div>

    <!-- User Profile Result -->
    <div id="resultBox" class="hidden mt-6 flex flex-col items-center">
      
      <!-- Avatar & Basic Info -->
      <div class="relative group">
        <img 
          id="userAvatar" 
          src="" 
          alt="Avatar" 
          class="w-28 h-28 rounded-full border-4 border-[#00f2fe] shadow-lg object-cover bg-slate-800"
        />
        <div id="verifiedBadge" class="hidden absolute bottom-1 right-1 bg-blue-500 text-white rounded-full w-7 h-7 flex items-center justify-center border-2 border-[#1e2030] shadow" title="Tài khoản đã xác minh">
          <i class="fa-solid fa-check text-xs"></i>
        </div>
      </div>

      <h2 id="userNickname" class="text-xl font-bold mt-3 text-white flex items-center gap-1.5"></h2>
      <a id="userHandleLink" href="#" target="_blank" class="text-slate-400 hover:text-[#00f2fe] text-sm transition-colors mb-2"></a>

      <!-- Bio / Description -->
      <p id="userBio" class="text-slate-300 text-xs sm:text-sm text-center max-w-md bg-[#13141f] border border-slate-800 p-3 rounded-xl mb-6 w-full italic whitespace-pre-line"></p>

      <!-- Stats Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full mb-6 text-center">
        <!-- Followers -->
        <div class="bg-[#13141f] border border-slate-800/80 p-4 rounded-xl">
          <span class="text-slate-400 text-xs uppercase font-medium block mb-1">Followers</span>
          <span id="statFollowers" class="text-lg sm:text-xl font-extrabold text-[#00f2fe]">0</span>
        </div>
        <!-- Following -->
        <div class="bg-[#13141f] border border-slate-800/80 p-4 rounded-xl">
          <span class="text-slate-400 text-xs uppercase font-medium block mb-1">Đang Follow</span>
          <span id="statFollowing" class="text-lg sm:text-xl font-extrabold text-white">0</span>
        </div>
        <!-- Likes -->
        <div class="bg-[#13141f] border border-slate-800/80 p-4 rounded-xl">
          <span class="text-slate-400 text-xs uppercase font-medium block mb-1">Lượt Thích</span>
          <span id="statLikes" class="text-lg sm:text-xl font-extrabold text-[#ff0050]">0</span>
        </div>
        <!-- Videos -->
        <div class="bg-[#13141f] border border-slate-800/80 p-4 rounded-xl">
          <span class="text-slate-400 text-xs uppercase font-medium block mb-1">Video</span>
          <span id="statVideos" class="text-lg sm:text-xl font-extrabold text-amber-400">0</span>
        </div>
      </div>

      <!-- Advanced Technical Info -->
      <div class="w-full bg-[#13141f]/70 border border-slate-800 rounded-xl p-3 text-xs text-slate-400 space-y-1">
        <div class="flex justify-between items-center break-all">
          <span>UID:</span>
          <span id="userUid" class="font-mono text-slate-300"></span>
        </div>
        <div class="flex justify-between items-center break-all">
          <span>SecUID:</span>
          <span id="userSecUid" class="font-mono text-slate-300 truncate max-w-[240px]"></span>
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex gap-3 w-full mt-4">
        <a 
          id="profileBtn" 
          href="#" 
          target="_blank" 
          class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-center text-sm font-semibold transition-all flex items-center justify-center gap-2">
          <i class="fa-brands fa-tiktok"></i> Mở trên TikTok
        </a>
      </div>
    </div>
  </main>

  <!-- Script Logic -->
  <script>
    // Định dạng số có dấu chấm/phẩy (ví dụ 10,500,000)
    function formatNumber(num) {
      if (num === null || num === undefined) return '0';
      return Number(num).toLocaleString('vi-VN');
    }

    // Lắng nghe phím Enter
    document.getElementById('usernameInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkTikTokUser();
      }
    });

    // Hàm gọi API thông qua Proxy để tránh CORS
    async function fetchWithFallback(url) {
      // 1. Thử gọi trực tiếp
      try {
        const res = await fetch(url);
        if (res.ok) return await res.json();
      } catch (err) {
        // Nếu bị chặn CORS, chuyển sang proxy
      }

      // 2. Dự phòng qua corsproxy.io
      try {
        const proxyUrl1 = `https://corsproxy.io/?${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl1);
        if (res.ok) return await res.json();
      } catch (err) {}

      // 3. Dự phòng tiếp qua allorigins
      const proxyUrl2 = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
      const res2 = await fetch(proxyUrl2);
      if (!res2.ok) throw new Error('Không thể kết nối đến máy chủ.');
      return await res2.json();
    }

    async function checkTikTokUser() {
      const input = document.getElementById('usernameInput');
      let username = input.value.trim();

      if (!username) {
        showStatus('Vui lòng nhập tên tài khoản TikTok!', 'warning');
        return;
      }

      // Chuẩn hóa tên người dùng (xóa @ hoặc link nếu dán cả url)
      username = username.replace(/^@/, '');
      if (username.includes('tiktok.com/@')) {
        username = username.split('tiktok.com/@')[1].split('/')[0].split('?')[0];
      }

      const checkBtn = document.getElementById('checkBtn');
      const statusBox = document.getElementById('statusBox');
      const loadingBox = document.getElementById('loadingBox');
      const resultBox = document.getElementById('resultBox');

      // UI State
      checkBtn.disabled = true;
      checkBtn.classList.add('opacity-60', 'cursor-not-allowed');
      statusBox.classList.add('hidden');
      resultBox.classList.add('hidden');
      loadingBox.classList.remove('hidden');

      try {
        // BƯỚC 1: Kiểm tra tài khoản tồn tại và lấy `sec_uid` qua Countik API
        const existEndpoint = `https://countik.com/api/exist/${username}`;
        const existData = await fetchWithFallback(existEndpoint);

        if (!existData || existData.status === false || !existData.sec_uid) {
          throw new Error('Tài khoản TikTok không tồn tại hoặc đã bị khóa/đặt ở chế độ riêng tư.');
        }

        const secUid = existData.sec_uid;

        // BƯỚC 2: Lấy thông tin chi tiết qua sec_uid từ Countik API
        const userEndpoint = `https://countik.com/api/user/id/${secUid}`;
        const userData = await fetchWithFallback(userEndpoint);

        if (!userData || userData.status === false) {
          throw new Error('Không thể tải chi tiết dữ liệu tài khoản từ Countik.');
        }

        // BƯỚC 3: Hiển thị kết quả lên giao diện
        renderUserData(userData, username, secUid);

      } catch (error) {
        showStatus(error.message || 'Đã có lỗi xảy ra trong quá trình tra cứu.', 'error');
      } finally {
        checkBtn.disabled = false;
        checkBtn.classList.remove('opacity-60', 'cursor-not-allowed');
        loadingBox.classList.add('hidden');
      }
    }

    function renderUserData(data, originalUsername, secUid) {
      // DOM Elements
      const avatar = document.getElementById('userAvatar');
      const nickname = document.getElementById('userNickname');
      const handleLink = document.getElementById('userHandleLink');
      const bio = document.getElementById('userBio');
      const verifiedBadge = document.getElementById('verifiedBadge');
      const statFollowers = document.getElementById('statFollowers');
      const statFollowing = document.getElementById('statFollowing');
      const statLikes = document.getElementById('statLikes');
      const statVideos = document.getElementById('statVideos');
      const userUid = document.getElementById('userUid');
      const userSecUid = document.getElementById('userSecUid');
      const profileBtn = document.getElementById('profileBtn');

      // Điền thông tin
      const uname = data.unique_id || originalUsername;
      nickname.innerText = data.nickname || uname;
      handleLink.innerText = `@${uname}`;
      handleLink.href = `https://www.tiktok.com/@${uname}`;
      profileBtn.href = `https://www.tiktok.com/@${uname}`;

      avatar.src = data.avatar || 'https://via.placeholder.com/150';
      avatar.onerror = () => { avatar.src = 'https://via.placeholder.com/150'; };

      // Tiểu sử (Bio)
      bio.innerText = data.signature && data.signature.trim() !== '' ? data.signature : '(Không có tiểu sử)';

      // Tích xanh
      if (data.is_verified) {
        verifiedBadge.classList.remove('hidden');
      } else {
        verifiedBadge.classList.add('hidden');
      }

      // Thống kê
      statFollowers.innerText = formatNumber(data.follower_count);
      statFollowing.innerText = formatNumber(data.following_count);
      statLikes.innerText = formatNumber(data.heart_count || data.heart);
      statVideos.innerText = formatNumber(data.video_count);

      // Technical IDs
      userUid.innerText = data.id || 'N/A';
      userSecUid.innerText = secUid;

      // Show Result
      document.getElementById('resultBox').classList.remove('hidden');
    }

    function showStatus(msg, type = 'info') {
      const box = document.getElementById('statusBox');
      box.classList.remove('hidden', 'bg-red-900/40', 'border-red-600', 'text-red-300', 'bg-amber-900/40', 'border-amber-600', 'text-amber-300');
      
      if (type === 'error') {
        box.classList.add('bg-red-900/40', 'border', 'border-red-600', 'text-red-300');
      } else if (type === 'warning') {
        box.classList.add('bg-amber-900/40', 'border', 'border-amber-600', 'text-amber-300');
      }
      box.innerHTML = `<i class="fa-solid fa-circle-exclamation mr-2"></i>${msg}`;
    }
  </script>
</body>
</html>
